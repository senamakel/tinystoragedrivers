[workspace]
members = ["module", "runner"]
resolver = "3"

[workspace.dependencies]
tinybus = { git = "https://github.com/tinyhumansai/tinybus", rev = "6ce06bc674e4f4d718aa51e643ef62c1f372e270", default-features = false }
serde_json = "1"
tinystoragedrivers-api = { path = "../../crates/tinystoragedrivers-api" }
tinystoragedrivers-types = { path = "../../crates/tinystoragedrivers-types" }

[profile.dev]
debug = false
