[workspace]
members = ["module", "runner"]
resolver = "3"

[workspace.dependencies]
tinybus = { git = "https://github.com/senamakel/tinybus", rev = "0de2d283f35cbbff08efad6fbe05537ffb74611b", default-features = false }
serde_json = "1"
tinystoragedrivers-api = { path = "../../crates/tinystoragedrivers-api" }
tinystoragedrivers-types = { path = "../../crates/tinystoragedrivers-types" }

[profile.dev]
debug = false
