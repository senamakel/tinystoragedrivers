[package]
name = "document-callback-module-proof"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
async-trait = "0.1"
serde_json.workspace = true
