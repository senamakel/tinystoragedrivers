[package]
name = "document-callback-module-proof"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
async-trait = "0.1"
serde_json.workspace = true
tinystoragedrivers-bus = { path = "../../../crates/tinystoragedrivers-bus" }
tinybus.workspace = true
# Only the fixture SDK exports the native ABI; no native storage implementation.
tinybus-module = { git = "https://github.com/senamakel/tinybus", rev = "0de2d283f35cbbff08efad6fbe05537ffb74611b" }
