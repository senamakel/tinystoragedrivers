[package]
name = "document-callback-module-proof"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
async-trait = "0.1"
serde_json.workspace = true
tinystoragedrivers-bus = { path = "../../../crates/tinystoragedrivers-bus" }
tinybus.workspace = true
# Only the fixture SDK exports the native ABI; no native storage implementation.
tinybus-module = { version = "0.3.7", git = "https://github.com/tinyhumansai/tinybus", rev = "2dc32b80efa58ed48bf2f40c721d1d018c8aeae1" }
