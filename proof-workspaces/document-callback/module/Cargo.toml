[package]
name = "document-callback-module-proof"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
async-trait = "0.1"
serde_json.workspace = true
tinystoragedrivers-bus = { path = "../../../crates/tinystoragedrivers-bus" }
tinybus.workspace = true
# Only the fixture SDK exports the native ABI; no native storage implementation.
tinybus-module = { version = "0.3.10", git = "https://github.com/tinyhumansai/tinybus", rev = "6b3c5b0cc14b1d07b68055b17a937b11de613efd" }
