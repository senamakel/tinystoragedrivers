name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Lint levels live in `[workspace.lints]` in the root Cargo.toml so local and
  # CI runs agree; don't add a blanket RUSTFLAGS here.
  CARGO_TERM_COLOR: always

jobs:
  native-secrets:
    name: Native secret files (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, llvm-tools-preview
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux Secret Service build and native probe dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev libglib2.0-bin dbus gnome-keyring
      # Run the new named regression before a broader suite can fail. These
      # are native runtime tests; cross-target compilation is not acceptance.
      - name: Windows empty production handle at birth
        if: runner.os == 'Windows'
        run: cargo test --locked -p tinystoragedrivers-secrets --no-default-features --features file --lib file::tests::windows_birth::reserved_empty_file_has_protected_owner_dacl_before_bytes_under_broad_parent -- --exact --nocapture
      - name: Unix empty production handle at birth
        if: runner.os != 'Windows'
        run: cargo test --locked -p tinystoragedrivers-secrets --no-default-features --features file --lib file::tests::unix_birth::reserved_empty_file_is_owner_only_at_birth_with_permissive_umask -- --exact --nocapture
      - name: Windows public key data and lock fixture
        if: ${{ always() && runner.os == 'Windows' }}
        run: cargo test --locked -p tinystoragedrivers-secrets --no-default-features --features file --lib file::tests::windows_birth::published_key_data_and_lock_have_protected_owner_dacl_in_admitted_namespace -- --exact --nocapture
      - name: Record Stage3 native toolchain versions
        if: always()
        run: |
          rustup show active-toolchain
          rustc --version
          cargo clippy --version
      - name: Windows canonical local path identity regression
        if: ${{ always() && runner.os == 'Windows' }}
        run: cargo test --locked -p tinystoragedrivers-secrets --no-default-features --features file --lib file::tests::windows_birth::canonical_local_verbatim_paths_retain_native_namespace_and_file_identity -- --exact --nocapture
      # Keep native key/file compatibility evidence even when birth is RED.
      # MongoDB and Bash service setup remain in the existing Linux lanes.
      - name: Native existing file and key tests
        if: always()
        run: cargo test --locked -p tinystoragedrivers-secrets --no-default-features --features file --lib file::tests -- --nocapture
      - name: Exercise the actual Windows finite diagnostic launcher
        if: ${{ runner.os == 'Windows' }}
        run: |
          python .github/scripts/native_user_denial_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .github/scripts/check-native-user-denial.py --check-windows-diagnostic-launcher
      - name: Actual separate standard user cannot read key data or either lock
        if: always()
        run: python .github/scripts/check-native-user-denial.py
      - name: Native strict secrets lint
        run: cargo clippy --locked -p tinystoragedrivers-secrets --all-features --all-targets -- -D warnings
      - name: Clear instrumented artifacts for a fresh compiled source inventory
        run: cargo llvm-cov clean --workspace
      - name: Bind native coverage execution to the original source base
        run: python .github/scripts/check-native-secrets-coverage.py --begin
      - name: Native complete secrets tests and LLVM JSON
        run: cargo llvm-cov --locked -p tinystoragedrivers-secrets --all-features --json --output-path target/secrets-native-coverage.json
      - name: Test fail-closed native coverage accounting
        run: python .github/scripts/native_coverage_tests.py
      - name: Install native Linux syscall observation
        if: runner.os == 'Linux'
        run: sudo apt-get install --yes strace
      - name: Observe native Linux publication faults and retained-source retry
        if: runner.os == 'Linux'
        run: python .github/scripts/check-native-io-fault.py
      - name: Observe a real paused key publisher and concurrent reader
        if: runner.os == 'Linux'
        run: python .github/scripts/check-native-key-race.py
      - name: Exercise the real isolated Secret Service provider
        if: runner.os == 'Linux'
        run: python3 .github/scripts/check-native-secret-service.py --coverage
      - name: Include all native executions in LLVM JSON
        run: cargo llvm-cov report --json --output-path target/secrets-native-coverage.json
      - name: Export the same native execution as LCOV
        run: cargo llvm-cov report --lcov --output-path target/secrets-native-coverage.lcov
      - name: Require native compiled production coverage and original changed-line coverage
        run: python .github/scripts/check-native-secrets-coverage.py
      - name: Upload native coverage and provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-secrets-${{ runner.os }}
          path: |
            target/secrets-native-coverage.json
            target/secrets-native-coverage.lcov
            target/secrets-native-provenance.json
            target/secrets-native-coverage-receipt.json
            target/native-io-fault-*/*
            target/native-key-race-*/*
            target/native-secret-service-*/receipt.json
            target/native-user-denial-*/*
          if-no-files-found: error

  rust:
    name: Rust
    runs-on: ubuntu-latest
    env:
      # The MongoDB driver's `live_*` tests run against this server; the
      # coverage gate counts them, so this job needs the server up.
      TSD_MONGO_URL: mongodb://localhost:27017/tsd_test?directConnection=true
      # Likewise the RabbitMQ queue backend's `live_*` tests.
      TSD_RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672/%2f
      # The facade S3 conformance test must share the MinIO lifetime with the
      # full-workspace LLVM coverage run below.
      TSD_S3_URL: s3://tsd-test/ci?region=us-east-1&endpoint=http%3A%2F%2F127.0.0.1%3A19000
      AWS_ACCESS_KEY_ID: tsd-test-access
      AWS_SECRET_ACCESS_KEY: tsd-test-secret
    steps:
      - uses: actions/checkout@v7
        with:
          # This job executes repository code (cargo build/test); don't persist
          # the token in git config.
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux Secret Service build and native probe dependencies
        run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev libglib2.0-bin dbus gnome-keyring
      - name: Start a MongoDB replica set
        run: .github/scripts/start-mongo-replset.sh 27017
      - name: Start RabbitMQ
        run: .github/scripts/start-rabbitmq.sh 5672
      - name: Start MinIO for facade blob conformance and coverage
        run: .github/scripts/start-minio.sh 19000 tsd-minio-rust

      - name: Test release version and proof lockfile updates
        run: python3 .github/scripts/release_version_tests.py

      - name: Verify source release assets and checksums
        run: python3 .github/scripts/release_assets_tests.py

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check facade without optional backend features
        run: cargo check --locked -p tinystoragedrivers --no-default-features

      - name: Test shared storage testkit
        run: cargo test --locked -p tinystoragedrivers-testkit

      - name: Lint shared storage testkit
        run: cargo clippy --locked -p tinystoragedrivers-testkit --all-targets --all-features -- -D warnings

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test standalone blob memory, filesystem, and SQLite features
        run: |
          cargo test --locked -p tinystoragedrivers-blob
          cargo test --locked -p tinystoragedrivers-blob --no-default-features --features fs
          cargo test --locked -p tinystoragedrivers-blob --no-default-features --features sqlite
          cargo check --locked -p tinystoragedrivers-blob --no-default-features --features s3

      - name: Build
        run: cargo build --all-targets --all-features

      - name: Test
        run: cargo test --all-features

      - name: Test default features
        run: cargo test

      - name: Verify confidential document callbacks through a real module
        run: bash scripts/test-document-callback.sh
      - name: Verify all storage callbacks through a real module
        run: bash scripts/test-storage-callback.sh
      - name: Format and lint the excluded callback-proof workspace
        run: |
          cargo fmt --manifest-path proof-workspaces/storage-callback/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path proof-workspaces/storage-callback/Cargo.toml --workspace --all-targets --all-features -- -D warnings
      - name: Keep the compiled storage module on ports, not engine implementations
        run: |
          tree="$(cargo tree --locked --manifest-path proof-workspaces/storage-callback/Cargo.toml -p storage-callback-module-proof --all-features --edges normal,build --prefix none)"
          members="$(awk '{print $1}' <<<"$tree" | sort -u)"
          if [[ -z "$members" ]] || ! grep -Fxq storage-callback-module-proof <<<"$members"; then
            echo "module dependency tree is empty or omitted its root package" >&2
            exit 1
          fi
          for engine in tinystoragedrivers-connect tinystoragedrivers-document tinystoragedrivers-kv tinystoragedrivers-blob tinystoragedrivers-queue tinystoragedrivers-secrets tinystoragedrivers-testkit; do
            if grep -Fxq "$engine" <<<"$members"; then
              echo "compiled storage module links engine implementation: ${engine}" >&2
              exit 1
            fi
          done

      # These are the only production vocabularies every driver and consumer
      # needs. Exact forward dependency closures make any unreviewed transitive
      # package fail, including new clients, runtimes and native bindings.
      - name: Assert the types and API crates stay dependency-light
        run: |
          set -euo pipefail
          .github/scripts/check-vocabulary-deps.sh \
            tinystoragedrivers-types .github/dependency-allowlists/types.txt
          .github/scripts/check-vocabulary-deps.sh \
            tinystoragedrivers-api .github/dependency-allowlists/api.txt

      - name: Install native syscall observation for full-workspace coverage
        run: sudo apt-get install --yes strace

      - name: Require 90% line coverage in every source file
        run: .github/scripts/check-file-coverage.sh 90 coverage.json

      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-json
          path: coverage.json
          if-no-files-found: ignore
      - name: Stop MinIO
        if: always()
        run: .github/scripts/stop-minio.sh tsd-minio-rust

  facade-feature-matrix:
    name: Facade feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check memory-only and each facade feature
        run: scripts/test-features.sh

  facade-memory-only:
    name: Facade memory-only feature closure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check no-default-features build and assert optional engines are absent
        run: |
          cargo check --locked -p tinystoragedrivers --no-default-features
          tree="$(cargo tree --locked -p tinystoragedrivers --no-default-features --edges normal)"
          for forbidden in chacha20poly1305 aes-gcm keyring aws-config aws-sdk-kms google-cloud-kms; do
            if grep -F "$forbidden" <<<"$tree"; then
              echo "unexpected optional cryptography/provider dependency: $forbidden" >&2
              exit 1
            fi
          done

  secret-service:
    name: Real isolated Linux Secret Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.88.0'
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install owned-provider fixture dependencies
        run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev libglib2.0-bin dbus gnome-keyring
      - name: Strict feature-off and feature-on checks at MSRV
        run: |
          cargo clippy --locked -p tinystoragedrivers-secrets --all-targets --no-default-features --features keyring -- -D warnings
          cargo clippy --locked -p tinystoragedrivers-secrets --all-targets --no-default-features --features keyring-secret-service -- -D warnings
      - name: Test explicit provider selection and existing injected builders
        run: cargo test --locked -p tinystoragedrivers-secrets --features keyring-secret-service --lib
      - name: Test private-bus launcher invariants
        run: python3 .github/scripts/native_secret_service_tests.py
      - name: Native Set Get readback Delete NoEntry and locked absent denials
        run: python3 .github/scripts/check-native-secret-service.py
      - name: Retain privacy-safe native provider receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-secret-service
          path: target/native-secret-service-*/receipt.json
          if-no-files-found: error

  mongodb:
    name: MongoDB driver
    runs-on: ubuntu-latest
    env:
      TSD_MONGO_URL: mongodb://localhost:27017/tsd_test?directConnection=true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # A single-node replica set, so transactions run too. Started by a step
      # because a service container cannot pass `--replSet` to mongod.
      - name: Start a MongoDB replica set
        run: .github/scripts/start-mongo-replset.sh 27017

      - name: Test the driver against MongoDB
        run: |
          cargo test --locked -p tinystoragedrivers-document --features mongodb
          cargo test --locked -p tinystoragedrivers-blob --features mongodb

      - name: Test the facade's mongodb feature
        run: cargo test --locked -p tinystoragedrivers --no-default-features --features mongodb

  rabbitmq:
    name: RabbitMQ queue backend
    runs-on: ubuntu-latest
    env:
      TSD_RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672/%2f
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Start RabbitMQ
        run: .github/scripts/start-rabbitmq.sh 5672

      - name: Test the queue backend against RabbitMQ
        run: cargo test --locked -p tinystoragedrivers-queue --no-default-features --features rabbitmq

      - name: Test the facade's rabbitmq feature
        run: cargo test --locked -p tinystoragedrivers --no-default-features --features rabbitmq

  s3:
    name: S3-compatible blob driver
    runs-on: ubuntu-latest
    env:
      TSD_S3_URL: s3://tsd-test/ci?region=us-east-1&endpoint=http%3A%2F%2F127.0.0.1%3A19000
      AWS_ACCESS_KEY_ID: tsd-test-access
      AWS_SECRET_ACCESS_KEY: tsd-test-secret
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: MinIO blob conformance and facade S3 selection
        run: .github/scripts/test-minio.sh

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux Secret Service build dependency
        run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # `rust-version` is inherited from `[workspace.package]`, so every member
      # reports the same value. Read it off the package the module ships as
      # rather than off `packages[0]`, whose order cargo does not promise.
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          msrv="$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "tinystoragedrivers") | .rust_version')"
          if [[ -z "$msrv" || "$msrv" == "null" ]]; then
            echo "workspace.package.rust-version is not set in Cargo.toml" >&2
            exit 1
          fi
          echo "version=$msrv" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux Secret Service build dependency
        run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev

      - name: Build with the declared MSRV
        run: cargo build --all-targets --all-features

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all
