name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to release
        type: choice
        required: true
        options:
          - patch
          - minor
          - major
          - current

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The facade crate consumers depend on. Every member inherits the same
  # workspace version, so its version is the release version.
  RELEASE_PACKAGE: tinystoragedrivers

jobs:
  prepare:
    name: Prepare release
    if: ${{ (github.repository == 'tinyhumansai/tinystoragedrivers' && github.ref == 'refs/heads/main') || (github.repository == 'senamakel/tinystoragedrivers' && github.ref == 'refs/heads/epic/8131-storage-primitives') || (github.repository == 'senamakel/tinystoragedrivers' && github.ref == 'refs/heads/epic/8369-security-migration') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # The MongoDB driver's `live_*` tests run against this server, and the
      # coverage gate counts them, exactly as in CI.
      TSD_MONGO_URL: mongodb://localhost:27017/tsd_test?directConnection=true
      TSD_RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672/%2f
      TSD_S3_URL: s3://tsd-test/ci?region=us-east-1&endpoint=http%3A%2F%2F127.0.0.1%3A19000
      AWS_ACCESS_KEY_ID: tsd-test-access
      AWS_SECRET_ACCESS_KEY: tsd-test-secret
    outputs:
      crate_name: ${{ steps.version.outputs.crate_name }}
      next_version: ${{ steps.version.outputs.next_version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux Secret Service build and native probe dependencies
        run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev libglib2.0-bin dbus gnome-keyring strace

      - name: Start a MongoDB replica set
        run: .github/scripts/start-mongo-replset.sh 27017

      - name: Start RabbitMQ for live queue conformance
        run: .github/scripts/start-rabbitmq.sh 5672

      - name: Start MinIO for live blob conformance and coverage
        run: .github/scripts/start-minio.sh 19000 tsd-minio-release

      - name: Test release version and proof lockfile updates
        run: python3 .github/scripts/release_version_tests.py

      - name: Verify source release assets and checksums
        run: python3 .github/scripts/release_assets_tests.py

      - name: Check memory-only and each facade feature
        run: scripts/test-features.sh

      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-targets --all-features

      - name: Test
        run: cargo test --all-features

      - name: Verify storage callbacks through the compiled module
        run: bash scripts/test-storage-callback.sh

      - name: Require 90% line coverage in every source file
        run: .github/scripts/check-file-coverage.sh 90 target/coverage.json

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

      - name: Stop MinIO
        if: always()
        run: .github/scripts/stop-minio.sh tsd-minio-release

      - name: Stop RabbitMQ
        if: always()
        run: docker rm -f tsd-rabbitmq >/dev/null 2>&1 || true

      - name: Compute next version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          metadata="$(cargo metadata --format-version 1 --no-deps)"
          crate_name="$(jq -r --arg name "$RELEASE_PACKAGE" \
            '.packages[] | select(.name == $name) | .name' <<< "$metadata")"
          current_version="$(jq -r --arg name "$RELEASE_PACKAGE" \
            '.packages[] | select(.name == $name) | .version' <<< "$metadata")"
          if [[ -z "$crate_name" || "$crate_name" == "null" ]]; then
            echo "Could not resolve the crate name" >&2
            exit 1
          fi
          if [[ -z "$current_version" || "$current_version" == "null" ]]; then
            echo "Could not resolve the current crate version" >&2
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$current_version"
          case "${{ inputs.bump }}" in
            current)
              ;;
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              echo "Unsupported bump: ${{ inputs.bump }}" >&2
              exit 1
              ;;
          esac

          next_version="${major}.${minor}.${patch}"
          tag="v${next_version}"
          git fetch --tags origin

          if git rev-parse --verify --quiet "refs/tags/${tag}"; then
            if [[ "${{ inputs.bump }}" != "current" ]]; then
              echo "Tag ${tag} already exists" >&2
              exit 1
            fi
            tagged_version="$(
              git show "${tag}:Cargo.toml" \
                | sed -n '/^\[workspace\.package\]/,/^\[/ s/^version = "\([^"]*\)"/\1/p' \
                | head -n 1
            )"
            if [[ "$tagged_version" != "$current_version" ]]; then
              echo "Tag ${tag} does not contain version ${current_version}" >&2
              exit 1
            fi
          elif [[ "${{ inputs.bump }}" == "current" ]]; then
            echo "Tag ${tag} does not exist; choose a semantic version bump" >&2
            exit 1
          fi

          {
            echo "crate_name=${crate_name}"
            echo "current_version=${current_version}"
            echo "next_version=${next_version}"
            echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Update crate version
        if: ${{ inputs.bump != 'current' }}
        env:
          CRATE_NAME: ${{ steps.version.outputs.crate_name }}
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
        run: |
          set -euo pipefail
          python3 .github/scripts/update-release-version.py "$NEXT_VERSION" "$CRATE_NAME"

      - name: Commit version bump and tag
        if: ${{ inputs.bump != 'current' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh auth setup-git --hostname github.com
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Release ${RELEASE_TAG}"
          git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "${RELEASE_TAG}"

  github-release:
    name: Create GitHub release
    needs: prepare
    if: ${{ (github.repository == 'tinyhumansai/tinystoragedrivers' && github.ref == 'refs/heads/main') || (github.repository == 'senamakel/tinystoragedrivers' && github.ref == 'refs/heads/epic/8131-storage-primitives') || (github.repository == 'senamakel/tinystoragedrivers' && github.ref == 'refs/heads/epic/8369-security-migration') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The workflow's own commit carries the asset helper; a `current`
      # dispatch selects an older tag that may predate it.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          path: tagged-source
          persist-credentials: false

      # Consumers pin the git revision; the source archive and its checksum
      # make the exact tag verifiable by TinyBus-compatible release tooling.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Created as a draft so a failed asset step never leaves a published
          # release without its archive and checksum; it is published last.
          # `gh release list` includes drafts, which `gh release view` may not.
          if gh release list --repo "$REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' | grep -Fxq "$RELEASE_TAG"; then
            echo "Release ${RELEASE_TAG} already exists."
          else
            gh release create "$RELEASE_TAG" \
              --repo "$REPOSITORY" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --draft \
              --generate-notes
          fi

      - name: Build source archive and checksum manifest
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 .github/scripts/create-release-assets.py --repository tagged-source --tag "$RELEASE_TAG" --output-dir target/release-assets

      - name: Upload source archive and checksum manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "target/release-assets/tinystoragedrivers-${RELEASE_TAG}.tar.gz" \
            target/release-assets/checksum.toml \
            --repo "$REPOSITORY" \
            --clobber

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: gh release edit "$RELEASE_TAG" --repo "$REPOSITORY" --draft=false
