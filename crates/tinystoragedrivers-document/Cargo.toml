[package]
name = "tinystoragedrivers-document"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Document and stream primitive storage engines"
publish = false

[features]
default = ["memory"]
memory = []
sqlite = ["dep:rusqlite", "dep:tinystoragedrivers-connect", "tinystoragedrivers-connect/sqlite", "dep:tokio"]
mongodb = ["dep:mongodb", "dep:futures-util", "dep:tokio", "dep:tinystoragedrivers-connect", "tinystoragedrivers-connect/mongodb"]
file = ["dep:tokio", "dep:libc", "dep:tinystoragedrivers-connect", "tinystoragedrivers-connect/file"]
polling-watch = ["dep:tokio"]

[dependencies]
tinystoragedrivers-types = { workspace = true }
tinystoragedrivers-api = { workspace = true }
tinystoragedrivers-connect = { workspace = true, optional = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
data-encoding = { workspace = true }
zstd = { workspace = true }
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
tokio = { workspace = true, features = ["time"], optional = true }
libc = { version = "0.2", optional = true }
mongodb = { version = "3.6", default-features = false, features = ["compat-3-0-0", "rustls-tls", "dns-resolver"], optional = true }
futures-util = { version = "0.3", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "rt", "sync"] }
tinystoragedrivers-testkit = { version = "2.1.2", path = "../tinystoragedrivers-testkit" }
tinystoragedrivers-blob = { version = "2.1.2", path = "../tinystoragedrivers-blob", default-features = false, features = ["memory", "mongodb"] }

[lints]
workspace = true
