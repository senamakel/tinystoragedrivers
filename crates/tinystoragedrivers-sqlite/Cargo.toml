[package]
name = "tinystoragedrivers-sqlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "SQLite driver for tinystoragedrivers: generic document, stream and blob tables, FTS5 search, and raw access for owners that keep their own tables."
readme = "README.md"
keywords = ["storage", "database", "driver", "sqlite"]
categories = ["database"]
publish = false

[dependencies]
tinystoragedrivers-core = { workspace = true }
# SQLite with the bundled amalgamation (FTS5 and JSON functions included).
# `libsqlite3-sys` is a `links = "sqlite3"` crate, so every crate in a host's
# graph must resolve one version; a caret requirement lets Cargo unify with
# the host's own pin (OpenHuman pins 0.40.2).
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = { workspace = true }
# The `blobs.sha256` column.
sha2 = { workspace = true }
# Document bodies over 4 KiB are stored as zstd frames.
zstd = { workspace = true }
# Database calls run on the blocking pool so they never stall a runtime
# worker.
tokio = { workspace = true }

[dev-dependencies]
# `document_secrets_conformance`: the secrets suite over this driver's documents.
tinystoragedrivers-secrets = { workspace = true, features = ["testkit"] }
tinystoragedrivers-core = { workspace = true, features = ["testkit"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "rt"] }
tempfile = "3"
async-trait = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
