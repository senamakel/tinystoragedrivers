[package]
name = "tinystoragedrivers-bus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Minimal confined document collection wire contract."
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
# The compatibility client uses TinyBus; data-only consumers disable `client`.
tinybus = { workspace = true, optional = true }

[features]
# Keep the original client API available to existing default-feature consumers.
default = ["client"]
# The legacy confidential CRUD client; data-only consumers can omit TinyBus.
client = ["dep:tinybus"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
