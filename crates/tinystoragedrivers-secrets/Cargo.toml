[package]
name = "tinystoragedrivers-secrets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Encrypted secret storage for tinystoragedrivers: one SecretStore port over the OS keyring, an encrypted file, or any DocumentStore."
readme = "README.md"
keywords = ["secrets", "keyring", "encryption", "storage"]
categories = ["cryptography", "database"]
publish = false

[dependencies]
tinystoragedrivers-api = { workspace = true }
tinystoragedrivers-types = { workspace = true }
async-trait = { workspace = true }
# JSON encoding for encrypted document values and the file format.
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
# File and keyring operations block (disk I/O, an advisory lock, an OS keychain
# prompt), so they run on the runtime's blocking pool when one is present.
tokio = { workspace = true, optional = true }
# The AEAD OpenHuman already uses for `enc2:` values and `secrets.enc`; the same
# crate and version keeps existing ciphertext decrypting byte-for-byte. Its
# default `getrandom` feature supplies the OS nonce and key generator.
chacha20poly1305 = { version = "0.11", optional = true }
# OpenHuman's existing enc2 and secrets.enc ciphertext uses this version.
getrandom = { version = "0.4", optional = true }
# Per-scope data keys: HKDF-SHA256 over a master key, the scope as `info`.
hkdf = { version = "0.13", optional = true }
sha2_11 = { package = "sha2", version = "0.11", optional = true }
# Keys, decrypted values and the decrypted secrets map are wiped on drop.
zeroize = { workspace = true }
# The cross-process advisory lock on `secrets.enc.lock`. It takes the same
# `flock`/`LockFileEx` lock OpenHuman's `fs2` lock does, so the two interoperate.
fs4 = { version = "1", default-features = false, features = ["sync"], optional = true }
# The native OS credential stores, with the platform features OpenHuman ships.
keyring = { version = "3", optional = true, features = ["apple-native", "windows-native", "linux-native"] }

# Cloud KMS transports are opt-in; no cloud SDK enters desktop builds.
reqwest = { workspace = true, features = ["json", "rustls-tls"], optional = true }
bytes = { workspace = true, optional = true }
base64 = { version = "0.23", optional = true }
hmac = { version = "0.13", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }

[target.'cfg(unix)'.dependencies]
# Safe descriptor-relative no-follow opens, identity checks and directory sync.
rustix = { version = "1", default-features = false, features = ["fs", "process", "std"], optional = true }

[target.'cfg(windows)'.dependencies]
# Supplies owner/protected DACL to CREATE_NEW and returns an owned std File.
clack-private-fs = { version = "1", optional = true }
# Safe handle-bound ACL checks and native effective-token/volume admission.
windows-permissions = { version = "0.2", optional = true }
winsafe = { version = "0.0.29", default-features = false, features = ["advapi", "kernel"], optional = true }
# Safe native FileID and hard-link count readback on the actual std File.
winapi-util = { version = "0.1", optional = true }
# Safe same-volume native rename; this alone is not a durable namespace receipt.
atomicwrites = { version = "0.4", optional = true }

[dev-dependencies]
# Disposable native ACL fixtures; drop removes the fixture after assertions.
tempfile = { workspace = true }
tinystoragedrivers-testkit = { path = "../tinystoragedrivers-testkit", version = "2.1.2" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "rt", "sync", "net", "io-util"] }
tinystoragedrivers-document = { workspace = true, features = ["memory", "sqlite", "file", "mongodb"] }
tinystoragedrivers-connect = { workspace = true, features = ["sqlite", "file", "mongodb"] }

[target.'cfg(unix)'.dev-dependencies]
# The birth-mode regression changes umask only inside its disposable child.
rustix = { version = "1", default-features = false, features = ["process", "fs", "std"] }

[target.'cfg(windows)'.dev-dependencies]
# Native handle-bound owner/DACL inspection and fixture-only ACL setup.
windows-permissions = "0.2"
# Read the effective native token's user SID without local unsafe code.
winsafe = { version = "0.0.29", default-features = false, features = ["advapi", "kernel"] }

[features]
default = ["memory"]
memory = []
file = ["dep:tokio", "dep:chacha20poly1305", "dep:getrandom", "dep:serde", "dep:serde_json", "dep:fs4", "dep:sha2_11", "dep:rustix", "dep:clack-private-fs", "dep:windows-permissions", "dep:winsafe", "dep:winapi-util", "dep:atomicwrites"]
document = ["dep:serde", "dep:serde_json", "dep:chacha20poly1305", "dep:getrandom", "dep:hkdf", "dep:sha2_11"]
# REST transports with authenticated scope context, without heavyweight SDKs.
kms-aws = ["document", "dep:tokio", "dep:reqwest", "dep:base64", "dep:bytes", "dep:hmac", "dep:chrono"]
kms-gcp = ["document", "dep:tokio", "dep:reqwest", "dep:base64", "dep:bytes"]
# `KeyringSecrets`: secrets in the OS credential store (macOS Keychain, Windows
# Credential Manager, the Linux kernel keyring).
keyring = ["file", "dep:tokio", "dep:keyring"]
# Explicit Linux Secret Service with encrypted transport; never enabled by default.
keyring-secret-service = ["keyring", "keyring/sync-secret-service", "keyring/crypto-rust"]
# `testkit::secrets_conformance`: the behavioral suite every `SecretStore` runs.
testkit = []

[lints]
workspace = true
