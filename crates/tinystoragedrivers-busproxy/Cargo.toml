[package]
name = "tinystoragedrivers-busproxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The real TinyBus transport for the storage bus: a module-side StorageTransport over bus proxies, and the host-side registration of the Storage objects."
publish = false

[features]
test-stream-diagnostics = []

[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tinybus = { workspace = true, features = ["modules"] }
tinystoragedrivers-bus.workspace = true
tinystoragedrivers-client.workspace = true
tinystoragedrivers-core.workspace = true
tokio = { workspace = true, features = ["sync", "io-util", "rt", "time"] }

[dev-dependencies]
tinystoragedrivers-secrets = { path = "../tinystoragedrivers-secrets" }
tinystoragedrivers-core = { workspace = true, features = ["testkit", "test-util"] }
tinybus-module.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync", "io-util"] }

[lints]
workspace = true
