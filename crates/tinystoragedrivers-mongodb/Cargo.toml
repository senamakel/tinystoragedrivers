[package]
name = "tinystoragedrivers-mongodb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The MongoDB driver for tinystoragedrivers: one shared database, every record scoped to its tenant."
readme = "README.md"
keywords = ["storage", "database", "driver", "mongodb"]
categories = ["database"]
publish = false

[dependencies]
tinystoragedrivers-core = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
# Bind opaque resume tokens without exposing query or guard values.
sha2 = { workspace = true }
# The official MongoDB client. The feature set matches the `mongodb = "3.6"`
# OpenHuman already links through tinyflows-adaptive (the crate's defaults
# spelled out), so a cloud build carries one copy: BSON 2 (`compat-3-0-0`),
# rustls on ring (never OpenSSL), and the DNS resolver `mongodb+srv://` needs.
mongodb = { version = "3.6", default-features = false, features = [
    "compat-3-0-0",
    "rustls-tls",
    "dns-resolver",
] }
# `AsyncWriteExt`/`AsyncReadExt` for GridFS upload and download streams, and
# `TryStreamExt` to drain cursors. Already in the tree through `mongodb`.
futures-util = { version = "0.3", default-features = false, features = ["io"] }


# Yield between transient transaction conflicts; the client already uses Tokio.
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
# `document_secrets_conformance`: the secrets suite over this driver's documents.
tinystoragedrivers-secrets = { workspace = true, features = ["testkit"] }
# The conformance suite, the memory driver the differential test compares
# against, and the blocking bridge the live tests call the driver through.
tinystoragedrivers-core = { workspace = true, features = ["testkit", "blocking"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
