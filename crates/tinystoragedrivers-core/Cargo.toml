[package]
name = "tinystoragedrivers-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Storage ports, the in-memory driver and the driver conformance suite for tinystoragedrivers."
readme = "README.md"
keywords = ["storage", "database", "driver", "sqlite", "mongodb"]
categories = ["database"]
publish = false

[dependencies]
# Reexport shared pure declarations while retaining the legacy core API.
tinystoragedrivers-schema = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `Key::of` hashes keys that outgrow the document id limit.
sha2 = { workspace = true }
# `Key::ulid`: time-sortable entity ids.
ulid = { workspace = true }
# Hashed scope segments and keys: lowercase RFC 4648 base32.
data-encoding = { workspace = true }
# Sealed streams (`SealedLog`) are zstd-compressed JSON.
zstd = { workspace = true }
# AsyncRead is the streaming blob port; io-util adds no runtime or transport.
tokio = { workspace = true, features = ["io-util", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "rt", "sync", "time", "test-util"] }

[features]
default = []
# Fragmented confidential migration delivery; owns asynchronous conversion and cleanup tasks.
migration-delivery = ["tokio/rt", "tokio/sync", "tokio/time"]
# Explicit conservative invalidation; never claims native Watch history.
polling-watch = ["tokio/time"]
# `Blocking`: run a port's future from synchronous code on a dedicated runtime
# thread. For consumer traits that are still synchronous. `rt-multi-thread`
# provides `block_in_place`, which the bridge waits through so the caller's
# runtime keeps driving its own tasks.
blocking = ["tokio/rt-multi-thread"]
# `conformance`: the behavioral suite every driver must pass. Drivers enable it
# from their dev-dependencies.
# The conformance suite uses tokio::join! outside cfg(test); dev-dependency
# feature unification must not be needed to build or document this feature.
testkit = ["tokio/macros"]
# Opt-in native memory watches for tests that require the Watch capability.
test-util = ["tokio/sync"]

[lints]
workspace = true
